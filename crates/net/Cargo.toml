[package]
name = "wisp_net"
version = "0.7.0"
edition = "2024"
description = "Wisp Paper's HTTP: metadata lookups, literature searches, the streamed chat request and the update check. Blocking, on ureq."
license = "MIT"

[dependencies]
wisp_core = { path = "../core" }
serde_json = "1"
ureq = { version = "3", features = ["json", "socks-proxy"] }
async-channel = "2"

[lints]
workspace = true
