[package]
name = "wisp_paper"
version = "0.5.0"
edition = "2024"
description = "A local-first literature library drawn with GPUI: collect, organise, preview PDFs and ask AI about your papers"
license = "MIT"
readme = "README.md"

# `wisp_core` is the GPUI-free library engine, `wisp_net` its HTTP, and `wisp_cli` the `wisp` command over both; plain `cargo test` covers all four.
[workspace]
members = ["crates/core", "crates/net", "crates/cli"]
default-members = [".", "crates/core", "crates/net", "crates/cli"]

[dependencies]
wisp_core = { path = "crates/core" }
wisp_net = { path = "crates/net" }
anyhow = "1"
dirs = "7"
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
hayro = "0.9"
async-channel = "2"

# GPUI 0.2.2 / taffy 0.9.0 / xattr 0.2.3 with the quiet-md patches (Windows
# IME, CJK line breaking, …); see vendor/PATCHES.md.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
taffy = { path = "vendor/taffy" }
xattr = { path = "vendor/xattr" }

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[lints]
workspace = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1"

# Release packages: without the debug symbols nobody downloading them needs.
[profile.release]
strip = true
